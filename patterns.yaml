# Open Patterns Initiative — Machine-Readable Catalog
# https://github.com/cloudnirvana/open-patterns
#
# This file is the authoritative index of all patterns in the catalog.
# AI agents: read this file first to understand what's available.
# Humans: read README.md instead.

catalog:
  name: "Open Patterns Initiative"
  organization: "Cloud Nirvana"
  url: "https://github.com/cloudnirvana/open-patterns"
  license: "CC-BY-4.0"
  template: "PATTERN-TEMPLATE.md"
  agent_guide: "AI-GUIDE.md"
  contributing: "CONTRIBUTING.md"

categories:
  - id: trust-governance
    name: "Trust & Governance"
    description: "How humans and AI systems build confidence in each other"
    path: "patterns/trust-governance/"
  - id: agentic-architecture
    name: "Agentic Architecture"
    description: "Patterns for multi-agent systems, orchestration, coordination"
    path: "patterns/agentic-architecture/"
  - id: rag-knowledge
    name: "RAG & Knowledge"
    description: "Retrieval, chunking, search, knowledge management"
    path: "patterns/rag-knowledge/"
  - id: production-readiness
    name: "Production Readiness"
    description: "Getting AI from POC to production"
    path: "patterns/production-readiness/"
  - id: data-quality
    name: "Data Quality"
    description: "Patterns for data integrity, enrichment, dedup"
    path: "patterns/data-quality/"
  - id: cost-operations
    name: "Cost & Operations"
    description: "Managing AI costs, monitoring, scaling"
    path: "patterns/cost-operations/"
  - id: security-compliance
    name: "Security & Compliance"
    description: "Protecting AI systems, data, and trust boundaries"
    path: "patterns/security-compliance/"

patterns:
  - id: ladder-of-trust
    name: "Ladder of Trust"
    intent: "Incrementally grant an AI system more autonomy by earning trust through demonstrated reliability at each level."
    category: trust-governance
    difficulty: foundational
    path: "patterns/trust-governance/ladder-of-trust.md"
    status: published
    also_known_as:
      - "Progressive Autonomy"
      - "Trust Escalation"
      - "Graduated Delegation"
    key_concepts:
      - "Four levels: Supervised (Propose) → Guided (Execute with Guardrails) → Autonomous (Operate) → Strategic (Evolve)"
      - "Trust is per-action-type, not global"
      - "Bright lines: permanent constraints that never change"
      - "Layered enforcement: prompt → tool wrappers → sandbox → credentials"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: hub-and-spoke-orchestration
    name: "Hub-and-Spoke Agent Orchestration"
    intent: "Coordinate multiple AI agents through a single hub, eliminating lateral communication chaos."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/hub-and-spoke-orchestration.md"
    status: published
    also_known_as:
      - "Coordinator Pattern"
      - "Orchestrator Pattern"
      - "Single Point of Coordination"
    key_concepts:
      - "One orchestrator queries specialists, never lateral agent-to-agent calls"
      - "Multi-domain emails route exclusively to hub"
      - "Prevents conflicting drafts and duplicate work"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: files-over-databases
    name: "Files Over Databases for Agent State"
    intent: "Use isolated workspace files instead of shared databases for agent coordination state."
    category: agentic-architecture
    difficulty: foundational
    path: "patterns/agentic-architecture/files-over-databases.md"
    status: published
    also_known_as:
      - "File-Based State Management"
      - "Workspace Isolation"
    key_concepts:
      - "Transient state → files, permanent state → database"
      - "Per-agent workspaces eliminate race conditions"
      - "Filesystem is the message bus"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: email-triage-priority-chain
    name: "Email Triage with Priority Chain"
    intent: "Route emails to the right agent using a deterministic rule hierarchy that short-circuits on match."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/email-triage-priority-chain.md"
    status: published
    also_known_as:
      - "Firewall-Style Routing"
      - "First-Match Classification"
    key_concepts:
      - "Five-rule priority chain: Named Agent → Support Ticket → Special Sender → Domain → Content"
      - "First match wins, prevents rule conflicts"
      - "High-confidence rules before fuzzy matching"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: hybrid-memory-retrieval
    name: "Hybrid Memory Retrieval"
    intent: "Combine vector search, keyword search, and reranking to improve agent memory recall."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/hybrid-memory-retrieval.md"
    status: published
    key_concepts:
      - "Vector search (concepts) + BM25 (exact matches) + MMR reranking (diversity)"
      - "Temporal decay favors recent context"
      - "Deployed but not validated: honest about tuning gaps"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: context-lifecycle-management
    name: "Context Lifecycle Management"
    intent: "Ensure persistent AI agents never lose critical context due to context window limits by implementing tiered memory, proactive checkpointing, and domain-aware compaction."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/context-lifecycle-management.md"
    status: published
    also_known_as:
      - "Tiered Agent Memory"
      - "Context Checkpointing"
      - "Graceful Memory Degradation"
    key_concepts:
      - "Three memory tiers: working → session → long-term"
      - "Proactive checkpointing at 50-60% context threshold"
      - "Domain-aware compaction preserves strategic context"
      - "Includes Memory Flush Discipline subsection"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: deterministic-session-key-routing
    name: "Deterministic Session-Key Routing for Multi-Channel Agents"
    intent: "Route every incoming agent event through a deterministic session key so channel, agent, user, thread, authority, and transcript state stay separate and recoverable."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/deterministic-session-key-routing-for-multi-channel-agents.md"
    status: published
    also_known_as:
      - "Deterministic Session Routing"
      - "Channel-Scoped Agent Sessions"
      - "Event-to-Transcript Routing"
    key_concepts:
      - "One secure gateway can route work into multiple operating lanes"
      - "Session keys bind channel, actor, thread, and agent role to session state"
      - "Append-only transcripts support debugging, compaction, and recovery"
      - "Channel and role authority should be applied before memory or tools load"
    contributor: "Kalen Howell Sr"

  - id: per-agent-data-access-control
    name: "Per-Agent Data Access Control"
    intent: "Scope database access per agent with authorization wrappers, encrypted storage, and immutable audit logging."
    category: security-compliance
    difficulty: advanced
    path: "patterns/security-compliance/per-agent-data-access-control.md"
    status: published
    also_known_as:
      - "Least Privilege Database Access"
      - "Agent Authorization Model"
    key_concepts:
      - "Encrypted database (SQLCipher) as single source of truth"
      - "Per-agent wrapper scripts with authorization rules"
      - "Immutable audit log (agent can INSERT but not UPDATE/DELETE)"
      - "Layered enforcement: wrappers now, container sandboxing later"
      - "Connects to Ladder of Trust enforcement model"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: memory-access-control-by-session-type
    name: "Memory Access Control by Session Type"
    intent: "Isolate agent memory access based on session context so private data doesn't leak to unintended audiences."
    category: security-compliance
    difficulty: advanced
    path: "patterns/security-compliance/memory-access-control-by-session-type.md"
    status: published
    also_known_as:
      - "Tiered Memory Isolation"
      - "Per-Session Context Scoping"
      - "Memory Classification"
    key_concepts:
      - "Three tiers: Private (owner only), Team (business-safe), Public"
      - "Session-based file loading rules"
      - "Prompt-based enforcement insufficient: structural enforcement needed"
      - "Includes Cross-Session Context Bridging subsection"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: memory-vs-persistence-boundary
    name: "Memory vs Persistence Boundary"
    intent: "Know when to graduate information from agent memory files to structured database storage."
    category: data-quality
    difficulty: intermediate
    path: "patterns/data-quality/memory-vs-persistence-boundary.md"
    status: published
    also_known_as:
      - "Memory Graduation Pattern"
      - "Structured Data Extraction"
    key_concepts:
      - "Memory files for exploration/notes, database for operational truth"
      - "Four triggers for graduation: queried repeatedly, shared across agents, needs updates, regulatory requirement"
      - "Email signature reconstruction failure: enforcement gap documented"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: system-hygiene-for-agentic-systems
    name: "System Hygiene for Agentic Systems"
    intent: "Establish systematic pre/post-upgrade procedures, regression testing, and health validation to prevent production breakage when the underlying platform changes."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/system-hygiene-for-agentic-systems.md"
    status: published
    also_known_as:
      - "Platform Maintenance"
      - "Upgrade Safety"
      - "Change Management for AI Systems"
    key_concepts:
      - "Pre-upgrade: read release notes, backup config, identify breaking changes"
      - "Test environment: validate in isolated session before production"
      - "Regression suite: smoke tests for critical paths (email, cron, tools)"
      - "Post-upgrade: health checks, error logs, 24h monitoring"
      - "Rollback plan: documented reversion procedure"
      - "Never upgrade before critical work (demos, launches, deadlines)"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: business-continuity-disaster-recovery
    name: "Business Continuity & Disaster Recovery for Agent Systems"
    intent: "Ensure agent-dependent operations can resume within acceptable timeframes when platform failures, data corruption, or human error cause production outages."
    category: production-readiness
    difficulty: advanced
    path: "patterns/production-readiness/business-continuity-disaster-recovery.md"
    status: in-progress
    also_known_as:
      - "Backup & Recovery"
      - "System Resilience"
      - "Operational Continuity"
    key_concepts:
      - "Backup strategy: what, how often, where, retention policy"
      - "Versioning: config snapshots, database versions, dependency pinning"
      - "Recovery scenarios: platform failure, corruption, human error, total loss"
      - "RTO/RPO: recovery time and data loss objectives"
      - "Testing: quarterly restore drills validate backups work"
      - "SEEKING PRACTITIONER INPUT: share your disaster recovery experiences"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: local-first-data-architecture
    name: "Local-First Data Architecture"
    intent: "Sync external data sources to local storage so agents never block on network failures during live operations."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/local-first-data-architecture.md"
    status: published
    also_known_as:
      - "Offline-Capable Agent Architecture"
      - "Pre-Synced Data Layer"
    key_concepts:
      - "One-way sync: external sources → local database → agent queries"
      - "Sync runs daily (batch), agents query local (instant)"
      - "WiFi failure doesn't break live demos or operations"
      - "Includes Multi-Source Identity Resolution prerequisite"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: multi-source-memory-architecture
    name: "Multi-Source Memory Architecture"
    intent: "Structure agent memory across multiple sources with different lifetimes, audiences, and update patterns so agents can find the right information without drowning in noise."
    category: rag-knowledge
    difficulty: intermediate
    path: "patterns/rag-knowledge/multi-source-memory-architecture.md"
    status: published
    also_known_as:
      - "Tiered Memory"
      - "Memory Separation of Concerns"
      - "Multi-Tier Agent Memory"
    key_concepts:
      - "Five sources: MEMORY.md (curated long-term), daily logs (7-30 day retention), TEAM-CONTEXT.md (team-safe), operational docs (authoritative), session checkpoints (strategic snapshots)"
      - "Per-session loading rules (private vs team vs cron sessions)"
      - "Weekly distillation workflow from daily logs to MEMORY.md"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: context-cost-control
    name: "Context Cost Control for Multi-Agent Systems"
    intent: "Reduce token costs 90%+ through retrieval tuning, index pruning, and memory hygiene."
    category: cost-operations
    difficulty: intermediate
    path: "patterns/cost-operations/context-cost-control.md"
    status: published
    also_known_as:
      - "Cost Optimization for Agent Memory"
      - "Token Cost Reduction"
      - "Memory Hygiene Discipline"
    key_concepts:
      - "6-layer strategy: model selection, retrieval tuning, index pruning, memory hygiene, cron auditing, bootstrap discipline"
      - "Tested: $1,800/mo → $120/mo (93% cost reduction)"
      - "QMD snippet limits: 3 results, 400 chars/snippet, 2K injection cap (71% reduction per search)"
      - "Weekly distillation with auto-archive prevents unbounded growth"
      - "Implementation checklist: 4-week rollout"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: local-llm-classification-layer
    name: "Local LLM as Classification Layer"
    intent: "Use a free local model for reasoning-heavy classification tasks, keep expensive cloud models for drafting, generation, and coordination."
    category: cost-operations
    difficulty: intermediate
    path: "patterns/cost-operations/local-llm-classification-layer.md"
    status: published
    also_known_as:
      - "Tiered Model Selection"
      - "Local Inference for Classification"
      - "Hybrid Classification Pipeline"
    key_concepts:
      - "Hybrid: deterministic rules (60-70%) → local LLM (30-40%) → cloud model execution"
      - "Reasoning quality > speed for classification"
      - "Qwen 3 8B with thinking mode: 12/12 accuracy, $0 cost per classification"
      - "Hardware: Mac Mini M4 24GB, Ollama, ~6GB RAM for 8B model"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: rem-cycle-nightly-maintenance
    name: "REM Cycle: Nightly Maintenance for Agent Systems"
    intent: "Automated nightly health checks strengthen memory architecture, prevent data loss, and catch problems early while the system is idle."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/rem-cycle-nightly-maintenance.md"
    status: published
    also_known_as:
      - "System Health Monitoring"
      - "Preventive Maintenance"
      - "Self-Healing Systems"
    key_concepts:
      - "9 nightly checks: daily notes stub, QMD coverage, index health, file integrity, checkpoint cleanup, distillation reminder, DB backup, DB integrity, DB size"
      - "Silent when healthy (HEARTBEAT_OK), announces issues"
      - "Near-zero cost (filesystem checks only), detection next morning vs weeks later"
      - "Enforces Memory Flush Discipline, Context Lifecycle Management, Hybrid Memory Retrieval"
      - "REM = Rapid Eye Movement sleep (memory consolidation in humans)"
    contributor: "Sean Erikson, Cloud Nirvana"
