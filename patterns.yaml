# Open Patterns Initiative — Machine-Readable Catalog
# https://github.com/cloudnirvana/open-patterns
#
# This file is the authoritative index of all patterns in the catalog.
# AI agents: read this file first to understand what's available.
# Humans: read README.md instead.

catalog:
  name: "Open Patterns Initiative"
  organization: "Cloud Nirvana"
  url: "https://github.com/cloudnirvana/open-patterns"
  license: "CC-BY-4.0"
  template: "PATTERN-TEMPLATE.md"
  agent_guide: "AI-GUIDE.md"
  contributing: "CONTRIBUTING.md"

categories:
  - id: trust-governance
    name: "Trust & Governance"
    description: "How humans and AI systems build confidence in each other"
    path: "patterns/trust-governance/"
  - id: agentic-architecture
    name: "Agentic Architecture"
    description: "Patterns for multi-agent systems, orchestration, coordination"
    path: "patterns/agentic-architecture/"
  - id: rag-knowledge
    name: "RAG & Knowledge"
    description: "Retrieval, chunking, search, knowledge management"
    path: "patterns/rag-knowledge/"
  - id: production-readiness
    name: "Production Readiness"
    description: "Getting AI from POC to production"
    path: "patterns/production-readiness/"
  - id: data-quality
    name: "Data Quality"
    description: "Patterns for data integrity, enrichment, dedup"
    path: "patterns/data-quality/"
  - id: cost-operations
    name: "Cost & Operations"
    description: "Managing AI costs, monitoring, scaling"
    path: "patterns/cost-operations/"
  - id: security-compliance
    name: "Security & Compliance"
    description: "Protecting AI systems, data, and trust boundaries"
    path: "patterns/security-compliance/"
  - id: operations-orchestration
    name: "Operations & Orchestration"
    description: "Operational rhythms, task generation, execution coordination"
    path: "patterns/operations-orchestration/"

blueprints:
  description: "Compositions of individual patterns that produce emergent operational capabilities. A pattern solves one problem. A blueprint shows how to build a whole capability."
  path: "blueprints/"
  entries:
    - id: operational-cadence
      name: "Operational Cadence"
      intent: "Autonomous project management for hybrid human-AI teams through daily task synthesis, RACI ownership, escalation chains, and self-correcting feedback loops."
      path: "blueprints/operational-cadence.md"
      status: published
      composes:
        - runbook-driven-agent-cadence
        - plan-of-the-day
        - raci-scoped-notifications
        - escalation-chain-with-sla
        - eod-reconciliation
      contributor: "Sean Erikson & Lou, Cloud Nirvana"

    - id: strategic-program-management
      name: "Strategic Program Management"
      intent: "Scalable multi-agent program execution with built-in governance, trust progression, and structural enforcement across multiple concurrent workstreams."
      path: "blueprints/strategic-program-management.md"
      status: published
      composes:
        - operational-cadence
        - ladder-of-trust
        - per-agent-data-access-control
        - agentic-identity-lifecycle
        - hub-and-spoke-orchestration
      contributor: "Sean Erikson & Lou, Cloud Nirvana"

patterns:
  - id: ladder-of-trust
    name: "Ladder of Trust"
    intent: "Incrementally grant an AI system more autonomy by earning trust through demonstrated reliability at each level."
    category: trust-governance
    difficulty: foundational
    path: "patterns/trust-governance/ladder-of-trust.md"
    status: published
    also_known_as:
      - "Progressive Autonomy"
      - "Trust Escalation"
      - "Graduated Delegation"
    key_concepts:
      - "Four levels: Supervised (Propose) → Guided (Execute with Guardrails) → Autonomous (Operate) → Strategic (Evolve)"
      - "Trust is per-action-type, not global"
      - "Bright lines: permanent constraints that never change"
      - "Layered enforcement: prompt → tool wrappers → sandbox → credentials"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: checkpoint-gated-autonomy
    name: "Checkpoint-Gated Autonomy"
    intent: "Decouple AI agent work from human approval using durable state, so agents don't need to stay alive while humans decide."
    category: trust-governance
    difficulty: intermediate
    path: "patterns/trust-governance/checkpoint-gated-autonomy.md"
    status: published
    also_known_as:
      - "Stateless Approval Gate"
      - "Durable Human-in-the-Loop"
      - "Async Checkpoint Approval"
    key_concepts:
      - "Agent produces artifact + checkpoint file, then session ends"
      - "Human reviews on their own schedule, clicks Send or Edit"
      - "Handler reads checkpoint, executes action, needs zero prior context"
      - "No timeouts, no zombie sessions, no long-running waits"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: hub-and-spoke-orchestration
    name: "Hub-and-Spoke Agent Orchestration"
    intent: "Coordinate multiple AI agents through a single hub, eliminating lateral communication chaos."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/hub-and-spoke-orchestration.md"
    status: published
    also_known_as:
      - "Coordinator Pattern"
      - "Orchestrator Pattern"
      - "Single Point of Coordination"
    key_concepts:
      - "One orchestrator queries specialists, never lateral agent-to-agent calls"
      - "Multi-domain emails route exclusively to hub"
      - "Prevents conflicting drafts and duplicate work"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: files-over-databases
    name: "Files Over Databases for Agent State"
    intent: "Use isolated workspace files instead of shared databases for agent coordination state."
    category: agentic-architecture
    difficulty: foundational
    path: "patterns/agentic-architecture/files-over-databases.md"
    status: published
    also_known_as:
      - "File-Based State Management"
      - "Workspace Isolation"
    key_concepts:
      - "Transient state → files, permanent state → database"
      - "Per-agent workspaces eliminate race conditions"
      - "Filesystem is the message bus"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: email-triage-priority-chain
    name: "Email Triage with Priority Chain"
    intent: "Route emails to the right agent using a deterministic rule hierarchy that short-circuits on match."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/email-triage-priority-chain.md"
    status: published
    also_known_as:
      - "Firewall-Style Routing"
      - "First-Match Classification"
    key_concepts:
      - "Five-rule priority chain: Named Agent → Support Ticket → Special Sender → Domain → Content"
      - "First match wins, prevents rule conflicts"
      - "High-confidence rules before fuzzy matching"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: hybrid-memory-retrieval
    name: "Hybrid Memory Retrieval"
    intent: "Combine vector search, keyword search, and reranking to improve agent memory recall."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/hybrid-memory-retrieval.md"
    status: published
    key_concepts:
      - "Vector search (concepts) + BM25 (exact matches) + MMR reranking (diversity)"
      - "Temporal decay favors recent context"
      - "Deployed but not validated: honest about tuning gaps"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: context-lifecycle-management
    name: "Context Lifecycle Management"
    intent: "Ensure persistent AI agents never lose critical context due to context window limits by implementing tiered memory, proactive checkpointing, and domain-aware compaction."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/context-lifecycle-management.md"
    status: published
    also_known_as:
      - "Tiered Agent Memory"
      - "Context Checkpointing"
      - "Graceful Memory Degradation"
    key_concepts:
      - "Three memory tiers: working → session → long-term"
      - "Proactive checkpointing at 50-60% context threshold"
      - "Domain-aware compaction preserves strategic context"
      - "Includes Memory Flush Discipline subsection"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: per-agent-data-access-control
    name: "Per-Agent Data Access Control"
    intent: "Scope database access per agent with authorization wrappers, encrypted storage, and immutable audit logging."
    category: security-compliance
    difficulty: advanced
    path: "patterns/security-compliance/per-agent-data-access-control.md"
    status: published
    also_known_as:
      - "Least Privilege Database Access"
      - "Agent Authorization Model"
    key_concepts:
      - "Encrypted database (SQLCipher) as single source of truth"
      - "Per-agent wrapper scripts with authorization rules"
      - "Immutable audit log (agent can INSERT but not UPDATE/DELETE)"
      - "Layered enforcement: wrappers now, container sandboxing later"
      - "Connects to Ladder of Trust enforcement model"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: memory-access-control-by-session-type
    name: "Memory Access Control by Session Type"
    intent: "Isolate agent memory access based on session context so private data doesn't leak to unintended audiences."
    category: security-compliance
    difficulty: advanced
    path: "patterns/security-compliance/memory-access-control-by-session-type.md"
    status: published
    also_known_as:
      - "Tiered Memory Isolation"
      - "Per-Session Context Scoping"
      - "Memory Classification"
    key_concepts:
      - "Three tiers: Private (owner only), Team (business-safe), Public"
      - "Session-based file loading rules"
      - "Prompt-based enforcement insufficient: structural enforcement needed"
      - "Includes Cross-Session Context Bridging subsection"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: memory-vs-persistence-boundary
    name: "Memory vs Persistence Boundary"
    intent: "Know when to graduate information from agent memory files to structured database storage."
    category: data-quality
    difficulty: intermediate
    path: "patterns/data-quality/memory-vs-persistence-boundary.md"
    status: published
    also_known_as:
      - "Memory Graduation Pattern"
      - "Structured Data Extraction"
    key_concepts:
      - "Memory files for exploration/notes, database for operational truth"
      - "Four triggers for graduation: queried repeatedly, shared across agents, needs updates, regulatory requirement"
      - "Email signature reconstruction failure: enforcement gap documented"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: system-hygiene-for-agentic-systems
    name: "System Hygiene for Agentic Systems"
    intent: "Establish systematic pre/post-upgrade procedures, regression testing, and health validation to prevent production breakage when the underlying platform changes."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/system-hygiene-for-agentic-systems.md"
    status: published
    also_known_as:
      - "Platform Maintenance"
      - "Upgrade Safety"
      - "Change Management for AI Systems"
    key_concepts:
      - "Pre-upgrade: read release notes, backup config, identify breaking changes"
      - "Test environment: validate in isolated session before production"
      - "Regression suite: smoke tests for critical paths (email, cron, tools)"
      - "Post-upgrade: health checks, error logs, 24h monitoring"
      - "Rollback plan: documented reversion procedure"
      - "Never upgrade before critical work (demos, launches, deadlines)"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: business-continuity-disaster-recovery
    name: "Business Continuity & Disaster Recovery for Agent Systems"
    intent: "Ensure agent-dependent operations can resume within acceptable timeframes when platform failures, data corruption, or human error cause production outages."
    category: production-readiness
    difficulty: advanced
    path: "patterns/production-readiness/business-continuity-disaster-recovery.md"
    status: in-progress
    also_known_as:
      - "Backup & Recovery"
      - "System Resilience"
      - "Operational Continuity"
    key_concepts:
      - "Backup strategy: what, how often, where, retention policy"
      - "Versioning: config snapshots, database versions, dependency pinning"
      - "Recovery scenarios: platform failure, corruption, human error, total loss"
      - "RTO/RPO: recovery time and data loss objectives"
      - "Testing: quarterly restore drills validate backups work"
      - "SEEKING PRACTITIONER INPUT: share your disaster recovery experiences"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: local-first-data-architecture
    name: "Local-First Data Architecture"
    intent: "Sync external data sources to local storage so agents never block on network failures during live operations."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/local-first-data-architecture.md"
    status: published
    also_known_as:
      - "Offline-Capable Agent Architecture"
      - "Pre-Synced Data Layer"
    key_concepts:
      - "One-way sync: external sources → local database → agent queries"
      - "Sync runs daily (batch), agents query local (instant)"
      - "WiFi failure doesn't break live demos or operations"
      - "Includes Multi-Source Identity Resolution prerequisite"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: multi-source-memory-architecture
    name: "Multi-Source Memory Architecture"
    intent: "Structure agent memory across multiple sources with different lifetimes, audiences, and update patterns so agents can find the right information without drowning in noise."
    category: rag-knowledge
    difficulty: intermediate
    path: "patterns/rag-knowledge/multi-source-memory-architecture.md"
    status: published
    also_known_as:
      - "Tiered Memory"
      - "Memory Separation of Concerns"
      - "Multi-Tier Agent Memory"
    key_concepts:
      - "Five sources: MEMORY.md (curated long-term), daily logs (7-30 day retention), TEAM-CONTEXT.md (team-safe), operational docs (authoritative), session checkpoints (strategic snapshots)"
      - "Per-session loading rules (private vs team vs cron sessions)"
      - "Weekly distillation workflow from daily logs to MEMORY.md"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: context-cost-control
    name: "Context Cost Control for Multi-Agent Systems"
    intent: "Reduce token costs 90%+ through retrieval tuning, index pruning, and memory hygiene."
    category: cost-operations
    difficulty: intermediate
    path: "patterns/cost-operations/context-cost-control.md"
    status: published
    also_known_as:
      - "Cost Optimization for Agent Memory"
      - "Token Cost Reduction"
      - "Memory Hygiene Discipline"
    key_concepts:
      - "6-layer strategy: model selection, retrieval tuning, index pruning, memory hygiene, cron auditing, bootstrap discipline"
      - "Tested: $1,800/mo → $120/mo (93% cost reduction)"
      - "QMD snippet limits: 3 results, 400 chars/snippet, 2K injection cap (71% reduction per search)"
      - "Weekly distillation with auto-archive prevents unbounded growth"
      - "Implementation checklist: 4-week rollout"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: local-llm-classification-layer
    name: "Local LLM as Classification Layer"
    intent: "Use a free local model for reasoning-heavy classification tasks, keep expensive cloud models for drafting, generation, and coordination."
    category: cost-operations
    difficulty: intermediate
    path: "patterns/cost-operations/local-llm-classification-layer.md"
    status: published
    also_known_as:
      - "Tiered Model Selection"
      - "Local Inference for Classification"
      - "Hybrid Classification Pipeline"
    key_concepts:
      - "Hybrid: deterministic rules (60-70%) → local LLM (30-40%) → cloud model execution"
      - "Reasoning quality > speed for classification"
      - "Qwen 3 8B with thinking mode: 12/12 accuracy, $0 cost per classification"
      - "Hardware: Mac Mini M4 24GB, Ollama, ~6GB RAM for 8B model"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: rem-cycle-nightly-maintenance
    name: "REM Cycle: Nightly Maintenance for Agent Systems"
    intent: "Automated nightly health checks strengthen memory architecture, prevent data loss, and catch problems early while the system is idle."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/rem-cycle-nightly-maintenance.md"
    status: published
    also_known_as:
      - "System Health Monitoring"
      - "Preventive Maintenance"
      - "Self-Healing Systems"
    key_concepts:
      - "9 nightly checks: daily notes stub, QMD coverage, index health, file integrity, checkpoint cleanup, distillation reminder, DB backup, DB integrity, DB size"
      - "Silent when healthy (HEARTBEAT_OK), announces issues"
      - "Near-zero cost (filesystem checks only), detection next morning vs weeks later"
      - "Enforces Memory Flush Discipline, Context Lifecycle Management, Hybrid Memory Retrieval"
      - "REM = Rapid Eye Movement sleep (memory consolidation in humans)"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: agentic-identity-lifecycle
    name: "Agentic Identity & Lifecycle"
    intent: "Treat agents as a first-class identity type with their own lifecycle, per-capability trust progression, continuous observability, mandatory human ownership, and instant kill switch."
    category: trust-governance
    difficulty: advanced
    path: "patterns/trust-governance/agentic-identity-lifecycle.md"
    status: published
    also_known_as:
      - "Agent Identity Management"
      - "AI Agent Governance"
      - "Agent Provisioning & Retirement"
    key_concepts:
      - "5-phase lifecycle: Provision → Onboard → Operate → Escalate → Retire"
      - "Per-capability trust progression (not agent-level)"
      - "Mandatory human ownership (every agent has an accountable human)"
      - "Continuous observability and instant kill switch"
      - "Distinct from human IAM and service accounts"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: runbook-driven-agent-cadence
    name: "Runbook-Driven Agent Cadence"
    intent: "Separate the clock from the brain — one cron fires on schedule, one editable runbook defines what the agent does, and configuration lives in a datastore."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/runbook-driven-agent-cadence.md"
    status: published
    also_known_as:
      - "Single-Cron Runbook"
      - "Time-Aware Agent Execution"
      - "Cadence-as-Configuration"
    key_concepts:
      - "Cron knows WHEN, runbook knows WHAT, task board knows WORK"
      - "Editable behavior without infrastructure changes"
      - "Scales from 1 to 11+ agents without cron explosion"
      - "Runbook lives in Notion/database, not cron definition"
    contributor: "Sean Erikson, Cloud Nirvana"

  - id: plan-of-the-day
    name: "Plan of the Day"
    intent: "Synthesize multiple business event calendars, runbook playbooks, and in-flight work into a single daily executable plan with RACI ownership for every team member."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/plan-of-the-day.md"
    status: published
    also_known_as:
      - "Daily Task Synthesis"
      - "POD"
      - "Daily Drumbeat"
    key_concepts:
      - "Morning generation from registries + runbooks"
      - "RACI-based ownership assignment"
      - "Deduplication against in-flight work"
      - "Carryover tracking with aging policy"
      - "The day ends when the plan is done"
    contributor: "Sean Erikson & Lou, Cloud Nirvana"

  - id: raci-scoped-notifications
    name: "RACI-Scoped Notifications"
    intent: "Control operational notification volume in multi-agent systems by routing messages based on each person's RACI role per task."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/raci-scoped-notifications.md"
    status: published
    also_known_as:
      - "Role-Based Notification Routing"
      - "RACI Notification Filter"
    key_concepts:
      - "RACI defined per task in runbooks"
      - "Notification router reads RACI, delivers per config"
      - "Loosely coupled from task engine"
      - "Phased rollout (start narrow, expand)"
    contributor: "Sean Erikson & Lou, Cloud Nirvana"

  - id: escalation-chain-with-sla
    name: "Escalation Chain with SLA"
    intent: "Ensure AI agents surface blockers within a time-bound window instead of silently stalling, retrying, or hallucinating workarounds."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/escalation-chain-with-sla.md"
    status: published
    also_known_as:
      - "Structured Agent Escalation"
      - "Blocker SLA"
      - "Silent Stall Prevention"
    key_concepts:
      - "Ordered escalation chain with SLA clock"
      - "Unraised blockers are the worst failure mode"
      - "Structured escalation data (blocker, attempted, recommendation)"
      - "Metrics track both raised and unraised escalations"
    contributor: "Sean Erikson & Lou, Cloud Nirvana"

  - id: eod-reconciliation
    name: "EOD Reconciliation"
    intent: "Bridge the gap between work that happened and task status by cross-referencing open tasks against evidence sources at end of day."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/eod-reconciliation.md"
    status: published
    also_known_as:
      - "Implicit Completion Detection"
      - "Task-Evidence Reconciliation"
      - "Daily Closeout Sweep"
    key_concepts:
      - "Evidence-based completion detection"
      - "Multiple evidence sources per task type"
      - "Attribution logging (what evidence, what source)"
      - "Feeds carryover list for next day's planning"
      - "Complementary to REM Cycle (task health vs system health)"
    contributor: "Sean Erikson & Lou, Cloud Nirvana"

  - id: builder-reviewer-sub-agent-loop
    name: "Builder/Reviewer Sub-Agent Loop"
    intent: "Close the spec→build→review loop with dedicated sub-agents so that reviewer authority is limited to the spec and quality gates are structurally enforced, not opinion-driven."
    category: agentic-architecture
    difficulty: intermediate
    path: "patterns/agentic-architecture/builder-reviewer-sub-agent-loop.md"
    status: published
    also_known_as:
      - "Spec-Gated Build Loop"
      - "Dual Sub-Agent Review"
      - "Reviewer Authority Constraint"
    key_concepts:
      - "Builder sub-agent: implements against the spec, does not interpret requirements"
      - "Reviewer sub-agent: enforces acceptance criteria from the story file, not from the orchestrator's context"
      - "Reviewer authority is limited to the spec — no taste-based or scope-expanding feedback"
      - "PASS/FAIL verdict gates story progression; FAIL triggers a re-spec, not a re-prompt"
      - "Orchestrator reads story status from the file at each loop iteration (canonical source discipline)"
    contributor: "David Hague, flex project"

  - id: phase-spec-pause-resume
    name: "Phase Spec with Formal Pause/Resume"
    intent: "Preserve agentic initiative continuity across context clears, forks, and pauses using a story state machine and explicit deferred-story accounting."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/phase-spec-pause-resume.md"
    status: published
    also_known_as:
      - "Story State Machine"
      - "Agentic Phase Continuity"
      - "Phase Fork Protocol"
    key_concepts:
      - "Four story states: planned / in_progress / complete / deferred"
      - "Phase fork: originating phase records deferred stories with reason and destination phase"
      - "Phase resume: resuming phase references originating phase; stories get new IDs"
      - "Checkpoint gate: no phase can be completed with silently abandoned planned stories"
      - "Context compaction safety: state lives in the spec file, not the context window"
    contributor: "David Hague, flex project"

  - id: cer-backlog-living-phases
    name: "CER Backlog + Living Backlog Phases"
    intent: "Eliminate quarterly re-discovery of known issues with a quadrant triage log (Do Now / Do Later / Do Much Later / Do Never) where findings are never deleted, only resolved."
    category: operations-orchestration
    difficulty: intermediate
    path: "patterns/operations-orchestration/cer-backlog-living-phases.md"
    status: published
    also_known_as:
      - "Cold-Eyes Review Backlog"
      - "Living Backlog Phases"
      - "Quadrant Finding Log"
    key_concepts:
      - "CER (Cold-Eyes Review): structured external review generating a triage list, not a report"
      - "Four quadrants: Do Now (blocks shipping), Do Later (debt), Do Much Later (future), Do Never (acknowledged non-issues)"
      - "Findings are never deleted — resolved entries get disposition and date, not removal"
      - "Backlog grooming on every CER: pull-forward candidates from Do Later when their forcing function arrives"
      - "Living phases: phase docs for each quadrant are open files, not frozen artifacts"
    contributor: "David Hague, flex project"

  - id: per-phase-effort-seeded-prior
    name: "Per-Phase Effort.db with Seeded Prior"
    intent: "Bootstrap per-phase token-cost estimation from a cross-project baseline so new projects inherit a calibrated prior instead of starting blind."
    category: cost-operations
    difficulty: intermediate
    path: "patterns/cost-operations/per-phase-effort-seeded-prior.md"
    status: published
    also_known_as:
      - "Effort Prior Seeding"
      - "Cross-Project Cost Baseline"
      - "Token Cost Prior"
    key_concepts:
      - "effort.db: per-phase SQLite database recording token counts per story and attempt"
      - "Seeded prior: a cross-project baseline (effort_seed.json) provides default distributions before phase data accumulates"
      - "Per-phase isolation: each phase gets its own database; the seed prevents cold-start underestimation"
      - "Extends context-cost-control with a learned prior — moves from reactive monitoring to predictive budgeting"
      - "New-project cold start: without a seed, the first phase has no prior; seeding solves this with borrowed data"
    contributor: "David Hague, flex project"

  - id: conceptual-rebuild-completeness
    name: "Conceptual Rebuild Completeness"
    intent: "Require every new database table to have an operator management surface before phase checkpoint — ensuring new systems are observable without a database console."
    category: production-readiness
    difficulty: intermediate
    path: "patterns/production-readiness/conceptual-rebuild-completeness.md"
    status: published
    also_known_as:
      - "Schema-to-UI Parity Gate"
      - "Table Management Gate"
      - "Operator Surface Requirement"
    key_concepts:
      - "Gate: every new database table must answer 'where does a human manage this?' before phase checkpoint"
      - "Exceptions (must be explicitly documented): append-only audit logs, pure junction tables, cron-output cache tables"
      - "Scope interpretation: 'build X with full CRUD, evolve later' means build the CRUD now"
      - "Enforcement: management UI story must be in the same phase spec as the table — not the backlog"
      - "Discovered after phases shipped new data models with no operator surface and required emergency UI stories"
